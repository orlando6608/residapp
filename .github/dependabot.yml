# Vigilancia de dependencias (hallazgo M6). Dependabot abre un PR cuando hay una versión nueva de una acción de GitHub o de un paquete NuGet.
# Cada PR pasa el CI completo, así que se limita a una vez por semana, con las actualizaciones menores y de parche agrupadas y un tope de PR abiertos.
# Antes de fusionar uno, se consulta al agente `revisor-dependencias-residapp` (.claude/agents/): nunca se fusionan a ciegas ni de forma automática.
# Las librerías de JavaScript de src/ResidApp.Web/wwwroot/lib están copiadas a mano y Dependabot no las ve: se revisan a mano (docs/seguridad/hallazgos.md, M6).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      acciones-menores:
        update-types: [minor, patch]
    # Una versión mayor de una acción llega siempre en un PR propio, para mirarla sola.

  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
      - /tools/PruebaDictado
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      paquetes-menores:
        update-types: [minor, patch]
    ignore:
      # PDFsharp-MigraDoc 6.5.0 cambia la licencia de MIT a AGPL dual (AGPL o licencia comercial de pago) y obliga al código a elegir una (sin ella lanza
      # PdfSharpLicenseException). La AGPL obligaría a ofrecer el código fuente a quien use el servicio: decisión de Orlando (2026-11-13), nos quedamos en la 6.2.4 (MIT).
      # Revisar antes de usar el producto en un centro real o de privatizar el repositorio (docs/prompts-ia/continuar-construccion.md).
      - dependency-name: "PDFsharp-MigraDoc"
        versions: [">=6.5.0"]
      # Fijado a mano en Infrastructure para esquivar avisos de seguridad; la serie 11 es para .NET 11 y no aporta nada sobre la 10.x. Las 10.x siguen llegando.
      - dependency-name: "System.Security.Cryptography.Pkcs"
        update-types: ["version-update:semver-major"]
