name: Release

# Mantiene abierto un «PR de release» con el número de versión propuesto y las notas (a partir de los prefijos feat:/fix:/docs: de los PR).
# No sube la versión por sí sola: la versión cambia solo cuando Orlando fusiona ese PR, al cerrar un hito; entonces se crean el tag vX.Y.Z y la Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-26.04
    # Los PR creados con el token por defecto de Actions no lanzan los checks obligatorios de «Proteger main», y quedarían sin poder fusionarse.
    # Hace falta un token propio (GitHub App o token personal de alcance mínimo) guardado como secreto RELEASE_PLEASE_TOKEN. Mientras no exista,
    # este workflow no hace nada (el paso se omite): así se puede fusionar antes de crear el secreto.
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: release-please
        if: env.RELEASE_PLEASE_TOKEN != ''
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
