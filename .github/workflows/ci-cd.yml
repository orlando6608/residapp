name: CI/CD

on:
  push:
    branches: [main]
    # Tras fusionar no se prueba ni se despliega si el cambio es solo de documentación que la aplicación no publica (docs/, CLAUDE.md, README.md): no hay nada que
    # desplegar, y antes de fusionar el PR ya ha pasado todas las pruebas. Siguen desplegando el código, los scripts de base de datos, los workflows, .claude/ (una
    # prueba lee su registro) y todo docs/pendientes-cj/ (la aplicación sirve esos .html y .json). La última regla que casa con un fichero decide; en un push basta
    # que un fichero case para que se ejecute. Comprobado con un workflow desechable (docs sola no lanza nada; docs + código, sí). Los PR no llevan filtro: sus checks son obligatorios.
    paths:
      - "**"
      - "!docs/**"
      - "docs/pendientes-cj/**"
      - "!CLAUDE.md"
      - "!README.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

# Un PR que recibe otro commit cancela la ejecución anterior (gasta menos minutos si el repositorio pasa a privado). Las de main no se cancelan nunca
# (llevan el despliegue): cada ejecución de push tiene su propio grupo. Que no se solapen dos despliegues lo garantiza el «concurrency» del job deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P $MSSQL_SA_PASSWORD -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Sin apt: sus dependencias salen de los servidores de Ubuntu y, cuando el runner no los resolvía, el job caía aquí tras 9 minutos (2026-11-11).
      - name: Preparar sqlcmd
        run: bash .github/scripts/preparar-sqlcmd.sh

      - name: Crear base de datos de pruebas
        env:
          SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        run: |
          sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "CREATE DATABASE ResidAppTest"
          SQL_SERVER=localhost SQL_DATABASE=ResidAppTest SQL_USER=sa SQL_PASSWORD="$SA_PASSWORD" SQLCMD_EXTRA=-C \
            bash database/aplicar-scripts.sh

      # La seguridad por filas (0030, ADR 0008) deja pasar a db_owner: para probarla de verdad, la aplicación de los tests
      # funcionales se conecta con un usuario sin db_owner; el sembrado y las comprobaciones siguen con sa.
      - name: Crear usuario limitado de la aplicación
        env:
          SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        run: |
          app_password="App-$(openssl rand -hex 16)-x1!"
          echo "::add-mask::$app_password"
          echo "APP_SQL_PASSWORD=$app_password" >> "$GITHUB_ENV"
          sqlcmd -C -S localhost -d ResidAppTest -U sa -P "$SA_PASSWORD" -b -v CONTRASENA="$app_password" \
            -i database/seguridad/crear_usuario_aplicacion.sql

      - name: Restore
        run: dotnet restore src/ResidApp.sln

      - name: Build
        run: dotnet build src/ResidApp.sln --no-restore --configuration Release

      - name: Test
        env:
          RESIDAPP_TEST_CONNECTION_STRING: "Server=localhost,1433;Database=ResidAppTest;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True;MultipleActiveResultSets=true;"
          RESIDAPP_TEST_SQL_ERRORS_LOG: ${{ runner.temp }}/sql-errors.log
        run: |
          export RESIDAPP_TEST_APP_CONNECTION_STRING="Server=localhost,1433;Database=ResidAppTest;User Id=residapp_app;Password=$APP_SQL_PASSWORD;TrustServerCertificate=True;MultipleActiveResultSets=true;"
          dotnet test src/ResidApp.sln --no-build --configuration Release

      # Si un test falla con «No disponible», el log no dice por qué: aquí quedan las SqlException (número, mensaje y llamadas) que lo provocaron.
      - name: Excepciones de SQL durante las pruebas
        if: failure()
        env:
          SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        run: |
          log="${{ runner.temp }}/sql-errors.log"
          if [ -s "$log" ]; then
            echo "Por número de error:"
            sed -E "s/^[0-9:.]+ SQL #(-?[0-9]+):.*/\1/" "$log" | sort | uniq -c | sort -rn
            echo "--- Interbloqueos (1205), tiempos de espera (-2) y fallos de conexión:"
            grep -E "SQL #(1205|-2|0|53|-1|10054|40613):" "$log" | head -50 || true
            echo "--- Las demás, sin las esperadas por las pruebas (547, 2601, 2627, 33504; las 150 primeras):"
            grep -vE "SQL #(547|2601|2627|33504):" "$log" | head -150 || true
          else
            echo "Sin SqlException registradas."
          fi
          echo "--- Interbloqueos guardados por SQL Server (sesión system_health), el más reciente primero:"
          sqlcmd -C -S localhost -d master -U sa -P "$SA_PASSWORD" -I -W -s "|" -i database/diagnostico/interbloqueos_recientes.sql || true

      # Tras las pruebas las tablas tienen datos de varios centros: el usuario limitado, con un ámbito de cada centro, solo debe ver los suyos.
      - name: Comprobar el aislamiento por centro con los datos de las pruebas
        env:
          SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        run: sqlcmd -C -S localhost -d ResidAppTest -U sa -P "$SA_PASSWORD" -b -W -i database/seguridad/comprobar_aislamiento.sql

      # Solo en main y solo si todo lo anterior ha pasado: se publica lo ya compilado y probado, sin recompilar, y el job deploy lo descarga tal cual. Así se
      # despliega exactamente lo que pasó las pruebas y el despliegue se ahorra otra compilación completa (~1 min). El paquete no lleva secretos (la configuración
      # y las cadenas de conexión viven en Azure) y el artefacto se borra al día siguiente.
      - name: Publicar la aplicación (sin recompilar)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: dotnet publish src/ResidApp.Web/ResidApp.Web.csproj --configuration Release --no-build --output ./publish

      - name: Guardar el paquete publicado
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: publish
          path: ./publish
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Hallazgo A1: el despliegue pasa por el entorno «production», que solo se puede usar desde main. No pide aprobación manual (decisión consciente de Orlando, 2026-11-11:
    # lo que protege son las pruebas y las reglas de main; reconsiderar antes de datos reales). Azure acepta el
    # token de este job por su credencial federada «residapp-env-production» (sujeto ...:environment:production). Los secretos AZURE_SQL_ADMIN_* viven en ese
    # entorno, no en el repositorio. El permiso de pedir el token (id-token) es solo de este job: el de pruebas no lo necesita.
    environment: production
    permissions:
      id-token: write
      contents: read
    # Un solo despliegue a la vez: dos fusiones seguidas aplicarían los scripts de esquema sobre la misma base al mismo tiempo. Si hay uno en marcha, el siguiente
    # espera; si mientras tanto llega otro más, el que esperaba se cancela (el nuevo parte de main y lleva también sus cambios y sus scripts). El que ya está
    # en marcha no se cancela nunca: cortaría los scripts a medias.
    concurrency:
      group: deploy-azure-dev
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      # El paquete lo publicó el job build-and-test justo después de las pruebas, del mismo commit: aquí ya no se compila (ni hace falta .NET).
      - uses: actions/download-artifact@v8
        with:
          name: publish
          path: ./publish

      - name: Azure login (OIDC federado, sin secretos de larga duración)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preparar sqlcmd
        run: bash .github/scripts/preparar-sqlcmd.sh

      # Hallazgo A3: la base ya no acepta «todos los servicios de Azure». Este paso (1) abre una regla con la IP de este runner solo mientras se aplican los
      # scripts (el paso «Cerrar…» la quita, falle o no) y (2) deja las reglas «webapp-salida-…» iguales a las direcciones de salida posibles de la Web App:
      # si Azure las cambia, el siguiente despliegue las corrige. No toca «AllowDevMachine» (la IP de casa de Orlando).
      - name: Abrir el firewall de SQL a este runner y sincronizar las direcciones de la Web App
        run: |
          rg=rg-residapp-dev; srv=sql-residapp-dev
          runner_ip="$(curl -fsS --retry 3 https://api.ipify.org)"
          # reglas de un despliegue anterior que se cortó antes de cerrarlas
          for old in $(az sql server firewall-rule list -g "$rg" -s "$srv" --query "[?starts_with(name,'ci-runner-')].name" -o tsv); do
            az sql server firewall-rule delete -g "$rg" -s "$srv" -n "$old" -o none
          done
          az sql server firewall-rule create -g "$rg" -s "$srv" -n "ci-runner-$GITHUB_RUN_ID" --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" -o none
          want="$(az webapp show -g "$rg" -n app-residapp-dev --query possibleOutboundIpAddresses -o tsv | tr ',' '\n' | sort -u)"
          # sin direcciones no se borra nada: dejaría a la Web App sin base de datos
          [ -n "$want" ] || { echo "No se pudieron leer las direcciones de salida de la Web App"; exit 1; }
          while read -r name ip; do
            grep -qx "$ip" <<< "$want" || az sql server firewall-rule delete -g "$rg" -s "$srv" -n "$name" -o none </dev/null
          done < <(az sql server firewall-rule list -g "$rg" -s "$srv" --query "[?starts_with(name,'webapp-salida-')].[name,startIpAddress]" -o tsv)
          have="$(az sql server firewall-rule list -g "$rg" -s "$srv" --query "[?starts_with(name,'webapp-salida-')].startIpAddress" -o tsv)"
          for ip in $want; do
            grep -qx "$ip" <<< "$have" || az sql server firewall-rule create -g "$rg" -s "$srv" -n "webapp-salida-${ip//./-}" --start-ip-address "$ip" --end-ip-address "$ip" -o none
          done

      # Entorno de desarrollo/piloto interno con datos ficticios: aplica el esquema pendiente y la semilla de los centros de prueba.
      # Nunca replicar APLICAR_SEED=1 en un entorno de producción con datos reales.
      - name: Aplicar esquema y seed en Azure SQL
        env:
          # Administrador de la base de datos, solo para los scripts y los seeds. La aplicación se conecta con un usuario limitado
          # (database/seguridad/crear_usuario_aplicacion_azure.sql, ADR 0008) para que la seguridad por filas le aplique: estas
          # credenciales NO deben estar en la configuración de la Web App. Si faltan, se usa el usuario de la cadena de la app.
          SQL_ADMIN_USER: ${{ secrets.AZURE_SQL_ADMIN_USER }}
          SQL_ADMIN_PASSWORD: ${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}
        run: |
          cadena="$(az webapp config connection-string list --name app-residapp-dev --resource-group rg-residapp-dev \
            --query "[?name=='ResidApp'].value | [0]" -o tsv)"
          valor() { tr ';' '\n' <<< "$cadena" | awk -F= -v k="$1" 'tolower($1)==tolower(k) { sub(/^[^=]*=/, ""); print; exit }'; }
          server="$(valor Server)"; server="${server#tcp:}"
          export SQL_SERVER="$server"
          export SQL_DATABASE="$(valor 'Initial Catalog')"
          export SQL_USER="${SQL_ADMIN_USER:-$(valor 'User ID')}"
          export SQL_PASSWORD="${SQL_ADMIN_PASSWORD:-$(valor Password)}"
          echo "::add-mask::$SQL_PASSWORD"
          # Una regla nueva del firewall puede tardar en aplicarse: se espera a poder entrar (hasta unos 3 minutos) antes de lanzar los scripts.
          for intento in $(seq 1 18); do
            sqlcmd -C -S "$SQL_SERVER" -d "$SQL_DATABASE" -U "$SQL_USER" -P "$SQL_PASSWORD" -b -Q "SELECT 1" > /dev/null 2>&1 && break
            [ "$intento" -eq 18 ] && { echo "No se pudo entrar en la base: ¿ha llegado a aplicarse la regla del firewall de este runner?"; exit 1; }
            sleep 10
          done
          APLICAR_SEED=1 bash database/aplicar-scripts.sh

      # Se cierra siempre, aunque los scripts hayan fallado. Si el paso de abrir ni siquiera llegó a crearla no hay nada que cerrar; si existe y no se puede borrar,
      # el paso falla a la vista (antes un «|| true» escondió que «az sql server firewall-rule delete» no admite «--yes»).
      - name: Cerrar la regla del firewall de SQL de este runner
        if: always()
        run: |
          rg=rg-residapp-dev; srv=sql-residapp-dev; regla="ci-runner-$GITHUB_RUN_ID"
          if az sql server firewall-rule show -g "$rg" -s "$srv" -n "$regla" -o none 2> /dev/null; then
            az sql server firewall-rule delete -g "$rg" -s "$srv" -n "$regla" -o none
          fi

      # La aplicación calcula todas las horas con la zona del servidor y en producción no arranca si no es Europe/Madrid (ServerTimeZone).
      # Se fija aquí para que una Web App nueva o recreada no dependa de un ajuste manual. Solo se escribe si difiere: cambiar un ajuste reinicia la app.
      - name: Fijar la zona horaria de la Web App
        run: |
          actual="$(az webapp config appsettings list --name app-residapp-dev --resource-group rg-residapp-dev --query "[?name=='WEBSITE_TIME_ZONE'].value | [0]" -o tsv)"
          if [ "$actual" != "Europe/Madrid" ]; then
            az webapp config appsettings set --name app-residapp-dev --resource-group rg-residapp-dev --settings WEBSITE_TIME_ZONE=Europe/Madrid > /dev/null
          fi

      # Hallazgo A2: App Service redirige HTTP a HTTPS (la app no lo hace, para no entrar en bucle detrás del balanceador; sí manda HSTS).
      # Solo se escribe si hace falta, como la zona horaria.
      - name: Exigir HTTPS en la Web App
        run: |
          actual="$(az webapp show --name app-residapp-dev --resource-group rg-residapp-dev --query httpsOnly -o tsv)"
          if [ "$actual" != "true" ]; then
            az webapp update --name app-residapp-dev --resource-group rg-residapp-dev --https-only true > /dev/null
          fi

      # clean: sin él, el despliegue añade ficheros pero no borra los de antes: un documento movido o borrado del repo seguía
      # sirviéndose desde el servidor. Deja un corte de segundos con wwwroot a medias, aceptable en desarrollo con datos ficticios;
      # con usuarios reales, repensar el despliegue (WEBSITE_RUN_FROM_PACKAGE o slots de staging en un plan Standard).
      - name: Desplegar en Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-residapp-dev
          package: ./publish
          clean: true
