name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Semanal: las consultas de CodeQL se actualizan aunque el código no cambie.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# Un PR que recibe otro commit cancela la ejecución anterior (gasta menos minutos si el repositorio pasa a privado). Las de main no se cancelan nunca:
# cada ejecución de push tiene su propio grupo.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # Build manual en vez de autobuild: el mismo dotnet build que ya valida el CI con .NET 10, y solo del proyecto web y sus
      # referencias, para analizar lo que se despliega y no las pruebas.
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build src/ResidApp.Web/ResidApp.Web.csproj --configuration Release

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:csharp"
