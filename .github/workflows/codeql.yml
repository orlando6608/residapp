name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Semanal: las consultas de CodeQL se actualizan aunque el código no cambie.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Build manual en vez de autobuild: el mismo dotnet build que ya valida el CI con .NET 10, y solo del proyecto web y sus
      # referencias, para analizar lo que se despliega y no las pruebas.
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build
        run: dotnet build src/ResidApp.Web/ResidApp.Web.csproj --configuration Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
